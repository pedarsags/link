<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDARSAGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold2: #E8C96A; --gold3: #F5E0A0; --gold4: #a07830;
    --dark: #04040a; --dark2: #08080f; --dark3: #10101a; --dark4: #1a1a26; --dark5: #222230;
    --text: #F0EAD6; --text2: #8A8070; --text3: #4a4840;
    --r: 14px; --r2: 10px;
    --glow: 0 0 30px rgba(201,168,76,0.12), 0 0 60px rgba(201,168,76,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: "Vazirmatn", sans-serif;
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px 100px;
    overflow-x: hidden;
    position: relative;
  }

  /* === BACKGROUND === */
  .bg-orb {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 0;
    filter: blur(80px);
    animation: orbFloat 8s ease-in-out infinite alternate;
  }
  .bg-orb-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
    top: -100px; left: 50%; transform: translateX(-50%);
  }
  .bg-orb-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(120,80,200,0.04) 0%, transparent 70%);
    bottom: 20%; right: -50px;
    animation-delay: 3s; animation-duration: 11s;
  }
  .bg-orb-3 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(50,180,255,0.03) 0%, transparent 70%);
    top: 40%; left: -80px;
    animation-delay: 5s; animation-duration: 9s;
  }
  @keyframes orbFloat { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.15) translateY(-20px); } }

  /* noise */
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.018'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  /* grid lines */
  body::after {
    content: ""; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
  }

  .container {
    width: 100%; max-width: 460px;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }

  /* === PROFILE === */
  .profile {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 32px;
    animation: fadeDown 0.8s cubic-bezier(0.23,1,0.32,1) both;
  }

  .avatar-wrap {
    position: relative; margin-bottom: 18px;
    width: 110px; height: 110px;
  }

  .avatar {
    width: 110px; height: 110px;
    border-radius: 18px;
    object-fit: cover; object-position: center top;
    display: block;
    position: relative; z-index: 2;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 2px rgba(201,168,76,0.5);
    animation: avatarPulse 4s ease-in-out infinite;
  }

  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 2px rgba(201,168,76,0.5), 0 0 20px rgba(201,168,76,0.1); }
    50% { box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 2px rgba(232,201,106,0.8), 0 0 40px rgba(201,168,76,0.25); }
  }

  /* corner decorations */
  .avatar-corner {
    position: absolute; width: 16px; height: 16px; z-index: 3;
  }
  .avatar-corner::before, .avatar-corner::after {
    content: ""; position: absolute; background: var(--gold2);
  }
  .avatar-corner::before { width: 2px; height: 100%; }
  .avatar-corner::after  { width: 100%; height: 2px; }

  .avatar-corner.tl { top: -4px; right: -4px; }
  .avatar-corner.tl::before { right: 0; top: 0; }
  .avatar-corner.tl::after  { top: 0; right: 0; }

  .avatar-corner.tr { top: -4px; left: -4px; }
  .avatar-corner.tr::before { left: 0; top: 0; }
  .avatar-corner.tr::after  { top: 0; left: 0; }

  .avatar-corner.bl { bottom: -4px; right: -4px; }
  .avatar-corner.bl::before { right: 0; bottom: 0; }
  .avatar-corner.bl::after  { bottom: 0; right: 0; }

  .avatar-corner.br { bottom: -4px; left: -4px; }
  .avatar-corner.br::before { left: 0; bottom: 0; }
  .avatar-corner.br::after  { bottom: 0; left: 0; }

  /* orbiting dot */
  .orbit-ring {
    position: absolute; inset: -10px; border-radius: 28px;
    border: 1px dashed rgba(201,168,76,0.15);
    animation: orbitSpin 20s linear infinite; z-index: 1;
  }
  .orbit-dot {
    position: absolute; top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
  }

  @keyframes orbitSpin { to { transform: rotate(360deg); } }

  .name {
    font-family: "Cinzel", serif; font-size: 24px; font-weight: 900;
    letter-spacing: 5px; text-transform: uppercase; margin-bottom: 6px;
    background: linear-gradient(135deg, var(--gold3) 0%, var(--gold2) 40%, var(--gold) 70%, var(--gold4) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.3));
  }

  .bio {
    font-size: 12px; color: var(--text2); text-align: center;
    letter-spacing: 2px; line-height: 1.8; max-width: 280px;
    text-transform: uppercase;
  }

  /* === DIVIDER === */
  .divider {
    width: 100%; height: 1px; margin: 4px 0 28px;
    background: linear-gradient(to right, transparent, rgba(201,168,76,0.06) 20%, var(--gold) 50%, rgba(201,168,76,0.06) 80%, transparent);
    position: relative;
  }
  .divider::before {
    content: "✦"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold); font-size: 12px; line-height: 1;
    background: var(--dark); padding: 0 8px;
  }

  /* === SECTION LABEL === */
  .sec {
    width: 100%; display: flex; align-items: center; gap: 12px;
    margin: 24px 0 12px;
  }
  .sec span {
    font-size: 9px; letter-spacing: 3px; color: var(--text3);
    text-transform: uppercase; white-space: nowrap; font-weight: 500;
  }
  .sec::before, .sec::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(to right, transparent, rgba(201,168,76,0.12), transparent);
  }

  /* === SPOTIFY === */
  .spotify-wrap {
    width: 100%; border-radius: var(--r); overflow: hidden;
    border: 1px solid rgba(201,168,76,0.12);
    background: var(--dark3);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    opacity: 0; animation: fadeUp 0.5s ease 0.1s forwards;
    position: relative;
  }
  .spotify-wrap::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(135deg, rgba(29,185,84,0.04) 0%, transparent 50%);
    border-radius: var(--r);
  }
  .spotify-wrap iframe { display: block; width: 100%; border: none; position: relative; z-index: 2; }

  /* === YOUTUBE === */
  #yt-wrap {
    width: 100%; opacity: 0; animation: fadeUp 0.5s ease 0.1s forwards;
  }
  .yt-card {
    display: flex; flex-direction: column; background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.1); border-radius: var(--r);
    overflow: hidden; text-decoration: none; color: var(--text);
    transition: all 0.28s cubic-bezier(0.23,1,0.32,1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .yt-card:hover {
    border-color: rgba(255,0,0,0.4); transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px rgba(255,0,0,0.08);
  }
  .yt-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--dark4); overflow: hidden; }
  .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
  .yt-card:hover .yt-thumb img { transform: scale(1.04); }

  .yt-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .yt-play-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,0,0,0.9); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(255,0,0,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .yt-card:hover .yt-play-btn { transform: scale(1.1); box-shadow: 0 6px 28px rgba(255,0,0,0.6); }
  .yt-play-btn svg { width: 28px; height: 28px; margin-right: -3px; }

  .yt-meta { padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; }
  .yt-logo-sm { width: 20px; height: 14px; flex-shrink: 0; margin-top: 4px; }
  .yt-info { flex: 1; }
  .yt-badge { font-size: 9px; color: #FF4444; letter-spacing: 2px; font-weight: 700; display: block; margin-bottom: 5px; text-transform: uppercase; }
  .yt-title { font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--text); }

  /* === FOURTHWALL === */
  #fw-wrap { width: 100%; }
  .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .product-card {
    background: var(--dark3); border: 1px solid rgba(201,168,76,0.08);
    border-radius: var(--r); overflow: hidden;
    text-decoration: none; color: var(--text);
    transition: all 0.28s cubic-bezier(0.23,1,0.32,1);
    display: flex; flex-direction: column;
    opacity: 0; animation: fadeUp 0.5s ease forwards;
    position: relative;
  }
  .product-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 50%);
    opacity: 0; transition: opacity 0.28s; border-radius: var(--r);
  }
  .product-card:hover {
    border-color: rgba(201,168,76,0.35); transform: translateY(-4px);
    box-shadow: 0 10px 36px rgba(0,0,0,0.55), 0 0 20px rgba(201,168,76,0.08);
  }
  .product-card:hover::after { opacity: 1; }

  .product-card:nth-child(1) { animation-delay: 0.05s; }
  .product-card:nth-child(2) { animation-delay: 0.12s; }
  .product-card:nth-child(3) { animation-delay: 0.19s; }
  .product-card:nth-child(4) { animation-delay: 0.26s; }

  .product-img { width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--dark4); position: relative; }
  .product-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
  .product-card:hover .product-img img { transform: scale(1.08); }
  .product-img-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; }

  .product-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--gold); color: #000; font-size: 9px; font-weight: 700;
    padding: 3px 7px; border-radius: 4px; letter-spacing: 0.5px;
    z-index: 2;
  }

  .product-info { padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .product-name { font-size: 12px; font-weight: 500; line-height: 1.35; color: var(--text); }
  .product-price { font-size: 14px; font-weight: 700; color: var(--gold2); font-family: "Cinzel", serif; }

  .fw-cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; margin-top: 10px;
    background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, rgba(201,168,76,0.04) 100%);
    border: 1px solid rgba(201,168,76,0.18); border-radius: var(--r);
    text-decoration: none; color: var(--gold2);
    font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.28s;
    position: relative; overflow: hidden;
  }
  .fw-cta::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.1), transparent);
    transform: translateX(-100%); transition: transform 0.6s;
  }
  .fw-cta:hover { background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, rgba(201,168,76,0.08) 100%); border-color: rgba(201,168,76,0.4); }
  .fw-cta:hover::before { transform: translateX(100%); }

  /* === MUSIC PLATFORMS === */
  .music-grid {
    width: 100%; display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .music-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; padding: 14px 8px;
    background: var(--dark3); border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--r2); text-decoration: none; color: var(--text2);
    transition: all 0.25s cubic-bezier(0.23,1,0.32,1);
    font-size: 10px; letter-spacing: 0.5px; text-align: center;
    opacity: 0; animation: fadeUp 0.5s ease forwards;
    position: relative; overflow: hidden;
  }
  .music-btn::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: var(--platform-color, var(--gold)); opacity: 0; transition: opacity 0.25s;
  }
  .music-btn:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.12); color: var(--text); }
  .music-btn:hover::after { opacity: 1; }
  .music-btn svg, .music-btn img { width: 28px; height: 28px; flex-shrink: 0; }

  .music-btn:nth-child(1) { animation-delay: 0.04s; }
  .music-btn:nth-child(2) { animation-delay: 0.09s; }
  .music-btn:nth-child(3) { animation-delay: 0.14s; }
  .music-btn:nth-child(4) { animation-delay: 0.19s; }
  .music-btn:nth-child(5) { animation-delay: 0.24s; }
  .music-btn:nth-child(6) { animation-delay: 0.29s; }

  /* === SOCIAL LINKS === */
  .links { width: 100%; display: flex; flex-direction: column; gap: 8px; }

  .link-item {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; background: var(--dark3);
    border: 1px solid rgba(255,255,255,0.05); border-radius: var(--r);
    text-decoration: none; color: var(--text);
    transition: all 0.25s cubic-bezier(0.23,1,0.32,1);
    position: relative; overflow: hidden;
    opacity: 0; animation: fadeUp 0.5s ease forwards;
  }
  .link-item::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), transparent 60%);
    opacity: 0; transition: opacity 0.25s;
  }
  .link-item:hover { border-color: rgba(255,255,255,0.14); transform: translateY(-2px); background: var(--dark4); box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  .link-item:hover::before { opacity: 1; }
  .link-item:active { transform: scale(0.985); }

  .link-icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 20px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.2s;
  }
  .link-item:hover .link-icon { transform: scale(1.08); }
  .link-icon svg { width: 22px; height: 22px; }

  .link-text { flex: 1; min-width: 0; }
  .link-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
  .link-sub { font-size: 11px; color: var(--text2); }

  .link-arrow { color: var(--text3); font-size: 20px; flex-shrink: 0; transition: transform 0.2s, color 0.2s; }
  .link-item:hover .link-arrow { transform: translateX(-4px); color: var(--gold); }

  .link-item:nth-child(1) { animation-delay: 0.05s; }
  .link-item:nth-child(2) { animation-delay: 0.11s; }
  .link-item:nth-child(3) { animation-delay: 0.17s; }
  .link-item:nth-child(4) { animation-delay: 0.23s; }
  .link-item:nth-child(5) { animation-delay: 0.29s; }

  /* === LOADING === */
  .loading { display: flex; align-items: center; justify-content: center; gap: 7px; height: 90px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  /* === FOOTER === */
  .footer {
    margin-top: 50px; font-size: 10px; color: rgba(138,128,112,0.25);
    letter-spacing: 2px; text-align: center; text-transform: uppercase;
  }

  /* === ANIMATIONS === */
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse    { 0%,100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.3); } }

  @media (max-width: 380px) {
    .name { font-size: 20px; }
    .music-grid { grid-template-columns: repeat(3, 1fr); }
    .products-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<script>
/* ╔══════════════════════════════════════════════════════╗
   ║  ⚙️  CONFIG                                         ║
   ╚══════════════════════════════════════════════════════╝
   ⚠️  امنیت YouTube API:
   - هیچوقت key رو توی GitHub public نذار
   - توی Google Console برای key ات:
     APIs & Services → Credentials → API Key → Application restrictions
     → HTTP referrers → دامنه سایتت رو اضافه کن (مثلاً pedarsags.com/*)
   - اینطوری key دیده میشه ولی کسی نمیتونه از جای دیگه ازش استفاده کنه
*/
const CONFIG = {
  FW_TOKEN    : "ptkn_f6245312-ade0-4800-8368-357ad38d20fd",
  FW_STORE_URL: "https://pedarsags-shop.fourthwall.com",
  FW_MAX      : 4,
  YT_KEY      : "",   // بعد از محدود کردن در Google Console اینجا بذار
  YT_CHANNEL  : "",   // Channel ID کانالت (UCxxxxxxxxxx)
};

/* Fourthwall */
async function loadFourthwall() {
  const el = document.getElementById("fw-wrap");
  try {
    const res  = await fetch(`https://storefront-api.fourthwall.com/v1/collections/all/products?storefront_token=${CONFIG.FW_TOKEN}&size=${CONFIG.FW_MAX}`);
    if (!res.ok) throw new Error(res.status);
    const data  = await res.json();
    const prods = data.results || [];
    if (!prods.length) throw new Error("empty");

    const cards = prods.slice(0, CONFIG.FW_MAX).map((p, i) => {
      const variant  = p.variants?.find(v => v.unitPrice) || p.variants?.[0];
      const amount   = variant?.unitPrice?.value;
      const price    = amount ? "$" + parseFloat(amount).toFixed(2) : "—";
      const img      = p.images?.[0]?.url || "";
      const name     = p.name || "محصول";
      const link     = CONFIG.FW_STORE_URL + "/products/" + (p.slug || p.id || "");
      return `
        <a href="${link}" target="_blank" class="product-card" style="animation-delay:${i*0.07+0.04}s">
          <div class="product-img">
            ${img ? `<img src="${img}" alt="${name}" loading="lazy">` : `<div class="product-img-ph">🛍️</div>`}
            <div class="product-badge">NEW</div>
          </div>
          <div class="product-info">
            <div class="product-name">${name}</div>
            <div class="product-price">${price}</div>
          </div>
        </a>`;
    }).join("");

    el.innerHTML = `<div class="products-grid">${cards}</div><a href="${CONFIG.FW_STORE_URL}" target="_blank" class="fw-cta">✦ &nbsp; همه محصولات رو ببین</a>`;
  } catch(e) {
    el.innerHTML = `<a href="${CONFIG.FW_STORE_URL}" target="_blank" class="fw-cta" style="height:62px">🛍️ &nbsp; مشاهده فروشگاه PEDARSAGS</a>`;
  }
}

/* YouTube */
const YT_ICON = `<svg class="yt-logo-sm" viewBox="0 0 20 14"><path d="M19.58 2.19A2.5 2.5 0 0017.84.45C16.28 0 10 0 10 0S3.72 0 2.16.45A2.5 2.5 0 00.42 2.19 26.14 26.14 0 000 7a26.14 26.14 0 00.42 4.81 2.5 2.5 0 001.74 1.74C3.72 14 10 14 10 14s6.28 0 7.84-.45a2.5 2.5 0 001.74-1.74A26.14 26.14 0 0020 7a26.14 26.14 0 00-.42-4.81zM8 10V4l5.2 3L8 10z" fill="#FF0000"/></svg>`;

async function loadYouTube() {
  const el = document.getElementById("yt-wrap");
  if (!CONFIG.YT_KEY || !CONFIG.YT_CHANNEL) { renderYTFallback(el); return; }
  try {
    const res  = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${CONFIG.YT_KEY}&channelId=${CONFIG.YT_CHANNEL}&part=snippet,id&order=date&maxResults=1&type=video`);
    const data = await res.json();
    if (!data.items?.length) throw new Error("no_video");
    const v = data.items[0];
    const vid = v.id.videoId, title = v.snippet.title;
    const thumb = v.snippet.thumbnails.maxres?.url || v.snippet.thumbnails.high?.url || v.snippet.thumbnails.medium?.url;
    el.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${vid}" target="_blank" class="yt-card">
        <div class="yt-thumb">
          <img src="${thumb}" alt="${title}" loading="lazy">
          <div class="yt-overlay">
            <div class="yt-play-btn">
              <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="yt-meta">
          ${YT_ICON}
          <div class="yt-info">
            <span class="yt-badge">▶ آخرین ویدیو</span>
            <div class="yt-title">${title}</div>
          </div>
        </div>
      </a>`;
  } catch(e) { renderYTFallback(el); }
}

function renderYTFallback(el) {
  el.innerHTML = `
    <a href="https://www.youtube.com/@PEDARSAGS" target="_blank" class="yt-card">
      <div class="yt-meta" style="padding:18px 16px">
        ${YT_ICON}
        <div class="yt-info">
          <span class="yt-badge">▶ YOUTUBE</span>
          <div class="yt-title">کانال PEDARSAGS — کلیک کن و ویدیوها رو ببین
            ${!CONFIG.YT_KEY ? "<br><small style=\"color:var(--text3);font-size:10px;margin-top:6px;display:block\">برای نمایش آخرین ویدیو: YT_KEY و YT_CHANNEL رو در CONFIG پر کن</small>" : ""}
          </div>
        </div>
      </div>
    </a>`;
}

document.addEventListener("DOMContentLoaded", () => {
  loadFourthwall();
  loadYouTube();
});
</script>
