<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDARSAGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold2: #E8C96A; --gold3: #F5E0A0;
    --dark: #060606; --dark2: #0e0e0e; --dark3: #181818; --dark4: #242424;
    --text: #F0EAD6; --text2: #8A8070; --text3: #4e4840; --r: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark); color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh; display: flex; align-items: flex-start;
    justify-content: center; padding: 44px 16px 80px; overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.022'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 1px; height: 100vh;
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.055) 30%, rgba(201,168,76,0.055) 70%, transparent);
    pointer-events: none; z-index: 0;
  }

  .container {
    width: 100%; max-width: 440px; position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }

  .profile {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 28px; animation: fadeDown 0.7s ease both;
  }

  .avatar-wrap { position: relative; margin-bottom: 16px; }

  .avatar, .avatar-placeholder {
    width: 96px; height: 96px; border-radius: 50%;
    border: 2px solid var(--gold); display: block;
  }

  .avatar { object-fit: cover; background: var(--dark3); }

  .avatar-placeholder {
    background: var(--dark3); display: flex; align-items: center;
    justify-content: center; font-family: 'Cinzel', serif;
    font-size: 26px; font-weight: 900; color: var(--gold); letter-spacing: 2px;
  }

  .avatar-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.2); animation: spin 14s linear infinite;
  }

  .avatar-ring::after {
    content: ''; position: absolute; top: -2px; left: 50%;
    transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 7px var(--gold);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    font-family: 'Cinzel', serif; font-size: 22px; font-weight: 900;
    color: var(--gold2); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px;
  }

  .bio {
    font-size: 12px; color: var(--text2); text-align: center;
    letter-spacing: 1px; line-height: 1.7; max-width: 260px;
  }

  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 14px auto 26px;
  }

  .sec {
    width: 100%; display: flex; align-items: center; gap: 10px;
    margin: 20px 0 10px;
  }

  .sec span {
    font-size: 9px; letter-spacing: 2.5px; color: var(--text3);
    text-transform: uppercase; white-space: nowrap;
  }

  .sec::before, .sec::after {
    content: ''; flex: 1; height: 1px; background: rgba(201,168,76,0.08);
  }

  .links { width: 100%; display: flex; flex-direction: column; gap: 8px; }

  .link-item {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 13px 16px; background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.1); border-radius: var(--r);
    text-decoration: none; color: var(--text);
    transition: all 0.22s ease; position: relative; overflow: hidden;
    opacity: 0; animation: fadeUp 0.5s ease forwards;
  }

  .link-item::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.05), transparent 60%);
    opacity: 0; transition: opacity 0.22s;
  }

  .link-item:hover {
    border-color: rgba(201,168,76,0.38); transform: translateY(-2px);
    background: var(--dark4); box-shadow: 0 5px 22px rgba(0,0,0,0.45);
  }

  .link-item:hover::before { opacity: 1; }
  .link-item:active { transform: scale(0.985); }

  .link-icon {
    width: 40px; height: 40px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 19px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05);
  }

  .link-icon svg { width: 22px; height: 22px; }
  .link-text { flex: 1; min-width: 0; }
  .link-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
  .link-sub { font-size: 11px; color: var(--text2); }
  .link-arrow { color: var(--text3); font-size: 18px; flex-shrink: 0; transition: transform 0.2s, color 0.2s; }
  .link-item:hover .link-arrow { transform: translateX(-3px); color: var(--gold); }

  .link-item:nth-child(1)  { animation-delay: 0.04s; }
  .link-item:nth-child(2)  { animation-delay: 0.10s; }
  .link-item:nth-child(3)  { animation-delay: 0.16s; }
  .link-item:nth-child(4)  { animation-delay: 0.22s; }
  .link-item:nth-child(5)  { animation-delay: 0.28s; }
  .link-item:nth-child(6)  { animation-delay: 0.34s; }
  .link-item:nth-child(7)  { animation-delay: 0.40s; }
  .link-item:nth-child(8)  { animation-delay: 0.46s; }

  /* Spotify */
  .spotify-wrap {
    width: 100%; border-radius: var(--r); overflow: hidden;
    border: 1px solid rgba(201,168,76,0.1);
    opacity: 0; animation: fadeUp 0.5s ease 0.08s forwards;
  }
  .spotify-wrap iframe { display: block; width: 100%; border: none; }

  /* YouTube */
  #yt-wrap { width: 100%; opacity: 0; animation: fadeUp 0.5s ease 0.08s forwards; }

  .yt-card {
    display: flex; flex-direction: column; background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.1); border-radius: var(--r);
    overflow: hidden; text-decoration: none; color: var(--text);
    transition: all 0.22s ease;
  }

  .yt-card:hover {
    border-color: rgba(201,168,76,0.38); transform: translateY(-2px);
    box-shadow: 0 5px 22px rgba(0,0,0,0.45);
  }

  .yt-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--dark4); overflow: hidden; }
  .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .yt-card:hover .yt-thumb img { transform: scale(1.03); }

  .yt-play {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0,0,0,0.28); transition: background 0.2s;
  }
  .yt-card:hover .yt-play { background: rgba(0,0,0,0.12); }
  .yt-play svg { width: 54px; height: 54px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7)); }

  .yt-meta { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .yt-logo { width: 26px; height: 26px; flex-shrink: 0; margin-top: 3px; }
  .yt-title { font-size: 13px; font-weight: 500; line-height: 1.4; flex: 1; }
  .yt-badge { font-size: 9px; color: #FF0000; letter-spacing: 1.5px; font-weight: 700; display: block; margin-bottom: 4px; }

  /* Fourthwall */
  #fw-wrap { width: 100%; }

  .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .product-card {
    background: var(--dark3); border: 1px solid rgba(201,168,76,0.1);
    border-radius: var(--r); overflow: hidden; text-decoration: none;
    color: var(--text); transition: all 0.22s ease;
    display: flex; flex-direction: column;
    opacity: 0; animation: fadeUp 0.5s ease forwards;
  }

  .product-card:nth-child(1) { animation-delay: 0.04s; }
  .product-card:nth-child(2) { animation-delay: 0.10s; }
  .product-card:nth-child(3) { animation-delay: 0.16s; }
  .product-card:nth-child(4) { animation-delay: 0.22s; }

  .product-card:hover {
    border-color: rgba(201,168,76,0.4); transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }

  .product-img { width: 100%; aspect-ratio: 1; background: var(--dark4); overflow: hidden; }
  .product-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  .product-card:hover .product-img img { transform: scale(1.05); }
  .product-img-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; }

  .product-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .product-name { font-size: 12px; font-weight: 500; line-height: 1.35; color: var(--text); }
  .product-price { font-size: 13px; font-weight: 700; color: var(--gold2); font-family: 'Cinzel', serif; }

  .fw-all {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; margin-top: 8px;
    background: rgba(201,168,76,0.05); border: 1px solid rgba(201,168,76,0.13);
    border-radius: var(--r); text-decoration: none; color: var(--gold2);
    font-size: 13px; font-weight: 500; letter-spacing: 0.5px; transition: all 0.22s;
  }
  .fw-all:hover { background: rgba(201,168,76,0.11); border-color: rgba(201,168,76,0.38); }

  .loading { display: flex; align-items: center; justify-content: center; gap: 6px; height: 80px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .footer { margin-top: 44px; font-size: 10px; color: rgba(138,128,112,0.28); letter-spacing: 1.5px; }

  @keyframes fadeUp   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse    { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

  @media (max-width: 360px) {
    .name { font-size: 18px; }
    .products-grid { grid-template-columns: 1fr; }
  }
</style>

<script>
/* ╔══════════════════════════════════════════════════════╗
   ║  ⚙️  CONFIG — فقط اینجا رو ویرایش کن               ║
   ╚══════════════════════════════════════════════════════╝ */
const CONFIG = {
  // Fourthwall (آماده‌ست ✅)
  FW_TOKEN    : 'ptkn_f6245312-ade0-4800-8368-357ad38d20fd',
  FW_STORE_URL: 'https://pedarsags.fourthwall.com',
  FW_MAX      : 4,

  // YouTube (باید پر بشه)
  // راهنما: console.cloud.google.com → YouTube Data API v3 → Credentials
  // Channel ID: youtube.com/@PEDARSAGS → About → Share Channel → Copy Channel ID
  YT_KEY     : '',   // مثال: 'AIzaSy...'
  YT_CHANNEL : '',   // مثال: 'UCxxxxxxxxxxxxxxxx'
};

/* ══ Fourthwall ══ */
async function loadFourthwall() {
  const el = document.getElementById('fw-wrap');
  try {
    const url = `https://storefront-api.fourthwall.com/v1/collections/all/products?storefront_token=${CONFIG.FW_TOKEN}&size=${CONFIG.FW_MAX}`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const prods = data.results || [];
    if (!prods.length) throw new Error('empty');

    const cards = prods.slice(0, CONFIG.FW_MAX).map((p, i) => {
      const variant  = p.variants?.find(v => v.unitPrice) || p.variants?.[0];
      const amount   = variant?.unitPrice?.value;
      const currency = variant?.unitPrice?.currencyCode || 'USD';
      const price    = amount ? `$${parseFloat(amount).toFixed(2)}` : '—';
      const img      = p.images?.[0]?.url || '';
      const name     = p.name || 'محصول';
      const link     = `${CONFIG.FW_STORE_URL}/products/${p.slug || p.id || ''}`;

      return `
        <a href="${link}" target="_blank" class="product-card" style="animation-delay:${i*0.06+0.04}s">
          <div class="product-img">
            ${img ? `<img src="${img}" alt="${name}" loading="lazy">` : `<div class="product-img-ph">🛍️</div>`}
          </div>
          <div class="product-info">
            <div class="product-name">${name}</div>
            <div class="product-price">${price}</div>
          </div>
        </a>`;
    }).join('');

    el.innerHTML = `
      <div class="products-grid">${cards}</div>
      <a href="${CONFIG.FW_STORE_URL}" target="_blank" class="fw-all">🛍️ همه محصولات</a>`;

  } catch(e) {
    el.innerHTML = `
      <a href="${CONFIG.FW_STORE_URL}" target="_blank" class="fw-all" style="height:60px">
        🛍️ مشاهده فروشگاه PEDARSAGS
      </a>`;
  }
}

/* ══ YouTube ══ */
const YT_SVG = `<svg class="yt-logo" viewBox="0 0 24 24"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z" fill="#FF0000"/></svg>`;

async function loadYouTube() {
  const el = document.getElementById('yt-wrap');

  if (!CONFIG.YT_KEY || !CONFIG.YT_CHANNEL) {
    el.innerHTML = `
      <a href="https://www.youtube.com/@PEDARSAGS" target="_blank" class="yt-card">
        <div class="yt-meta" style="padding:16px 14px">
          ${YT_SVG}
          <div class="yt-title">
            <span class="yt-badge">▶ YOUTUBE</span>
            کانال PEDARSAGS — ویدیوهای جدید
            <br><small style="color:var(--text3);font-size:10px;margin-top:5px;display:block">
              برای نمایش آخرین ویدیو: YT_KEY و YT_CHANNEL را در CONFIG پر کن
            </small>
          </div>
        </div>
      </a>`;
    return;
  }

  try {
    const url  = `https://www.googleapis.com/youtube/v3/search?key=${CONFIG.YT_KEY}&channelId=${CONFIG.YT_CHANNEL}&part=snippet,id&order=date&maxResults=1&type=video`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data.items?.length) throw new Error('no_video');

    const v     = data.items[0];
    const vid   = v.id.videoId;
    const title = v.snippet.title;
    const thumb = v.snippet.thumbnails.high?.url || v.snippet.thumbnails.medium?.url;

    el.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${vid}" target="_blank" class="yt-card">
        <div class="yt-thumb">
          <img src="${thumb}" alt="${title}" loading="lazy">
          <div class="yt-play">
            <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
              <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#FF0000"/>
              <path d="M45 24 27 14v20" fill="#fff"/>
            </svg>
          </div>
        </div>
        <div class="yt-meta">
          ${YT_SVG}
          <div class="yt-title"><span class="yt-badge">▶ آخرین ویدیو</span>${title}</div>
        </div>
      </a>`;
  } catch(e) {
    el.innerHTML = `
      <a href="https://www.youtube.com/@PEDARSAGS" target="_blank" class="yt-card">
        <div class="yt-meta" style="padding:16px 14px">
          ${YT_SVG}
          <div class="yt-title"><span class="yt-badge">▶ YOUTUBE</span>کانال PEDARSAGS</div>
        </div>
      </a>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadFourthwall();
  loadYouTube();
});
</script>
</body>
</html>
